<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table</title>
<style>
  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-family: Arial, sans-serif;
  }

  td, th {
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 0.5rem;
    text-align: left;
  }

  th {
    background-color: #e0e0e0;
    font-weight: bold;
  }

  /* Odd rows = #f2f2f2, Even rows = #ffffff */
  /* header ko count na karne ke liye tbody use kiya hai */
  tbody tr:nth-child(odd) {
    background-color: #f2f2f2;
  }

  tbody tr:nth-child(even) {
    background-color: #ffffff;
  }
</style>
</head>
<body>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>City</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Rahul</td>
      <td>21</td>
      <td>Delhi</td>
    </tr>
    <tr>
      <td>Priya</td>
      <td>22</td>
      <td>Mumbai</td>
    </tr>
    <tr>
      <td>Aman</td>
      <td>20</td>
      <td>Jaipur</td>
    </tr>
    <tr>
      <td>Neha</td>
      <td>23</td>
      <td>Lucknow</td>
    </tr>
  </tbody>
</table>

</body>
</html>
